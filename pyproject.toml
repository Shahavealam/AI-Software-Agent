[project]
name = "ai-software-agent"
version = "1.0.0"
description = "Event-driven multi-agent autonomous software engineering system"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AI Software Agent Team" }]
keywords = ["agents", "langgraph", "codegen", "async", "llm"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Framework :: AsyncIO",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sse-starlette>=2.1.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "anyio>=4.4.0",
  "httpx>=0.27.0",
  "langgraph>=0.2.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "openai>=1.40.0",
  "tiktoken>=0.7.0",
  "tenacity>=8.5.0",
  "chromadb>=0.5.0",
  "motor>=3.5.0",
  "python-dotenv>=1.0.0",
  "structlog>=24.1.0",
  "rich>=13.7.0",
  "colorama>=0.4.6",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.9.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "coverage>=7.3.0", "ruff>=0.5.0", "mypy>=1.11.0", "black>=24.0.0"]
all = ["ai-software-agent[qdrant]", "ai-software-agent[dev]"]

[project.scripts]
ai-agent = "app.main:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
branch = true
